        body {

        }
        
        .container {

        }
        
        .sidebar {

            background: #132f4c;
            padding: 25px;
            overflow-y: auto;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        
        h1 {

            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa 0%, #06b6d4 100%);

        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #06b6d4;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        
        .legend {
            margin-bottom: 25px;
        }
        
        .legend h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        
        .legend-text {
            font-size: 0.9rem;
        }
        
        .legend-count {
            margin-left: auto;
            font-size: 0.8rem;
            color: #64748b;
        }
        
        .node-info {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .node-info.active {
            display: block;
        }
        
        .node-info h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #60a5fa;
        }
        
        .node-info p {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #94a3b8;
        }
        
        .node-info .value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #10b981;
        }
        
        .node-info .formula {
            font-family: monospace;
            font-size: 0.85rem;
            background: #0a1929;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            word-break: break-all;
        }
        
        #graph {
            flex: 1;
            height: 100vh;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            background: #132f4c;
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .control-btn:hover {
            background: #1e3a5f;
        }
        
        .search-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px 15px;
            color: #e2e8f0;
            width: 100%;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        .search-box::placeholder {
            color: #64748b;
        }
    </style>
</head>
