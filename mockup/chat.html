<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM Pro — AI Ассистент — Касаткина 7</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .chat-layout {
            display: flex;
            height: calc(100vh - 60px);
        }
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            max-width: 800px;
        }
        .message.user {
            flex-direction: row-reverse;
            margin-left: auto;
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .message.ai .message-avatar {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
        }
        .message.ai .message-avatar.speaking {
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.3);
            animation: speakPulse 1s infinite;
        }
        @keyframes speakPulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.1); }
        }
        .message.user .message-avatar {
            background: var(--bg-input);
            color: var(--text-muted);
        }
        .message-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            max-width: 600px;
        }
        .message.ai .message-content {
            border-left: 3px solid var(--accent);
        }
        .message.user .message-content {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--accent);
        }
        .message-text {
            font-size: 14px;
            line-height: 1.6;
        }
        .message-text p {
            margin-bottom: 12px;
        }
        .message-text p:last-child {
            margin-bottom: 0;
        }

        .inline-table {
            margin: 16px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .inline-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .inline-table th {
            background: var(--bg-input);
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            color: var(--text-muted);
        }
        .inline-table td {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
        }
        .inline-table .positive { color: var(--success); }
        .inline-table .negative { color: var(--error); }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: 600;
        }
        .action-btn.primary:hover {
            background: var(--accent-hover);
        }

        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
        }
        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            resize: none;
            min-height: 48px;
            max-height: 120px;
        }
        .chat-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .mic-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.15s;
        }
        .mic-btn:hover {
            background: rgba(245, 158, 11, 0.2);
        }
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:hover {
            background: var(--accent-hover);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }

        .quick-prompts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .quick-prompt {
            padding: 8px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }
        .quick-prompt:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Voice Toggle in Header */
        .voice-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 8px;
            color: var(--accent);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .voice-toggle:hover {
            background: rgba(245, 158, 11, 0.15);
        }
        .voice-toggle.muted {
            background: var(--bg-input);
            border-color: var(--border);
            color: var(--text-muted);
        }
        .voice-icon {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="18" height="18" fill="#fff" viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm16 16V5H5v14h14zM7 7h4v4H7V7zm0 6h4v4H7v-4zm6-6h4v10h-4V7z"/></svg>
                </div>
                FM Pro
            </div>

            <nav class="nav-section">
                <div class="nav-title">Портфель</div>
                <a href="projects.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
                    Список проектов
                </a>
            </nav>

            <nav class="nav-section">
                <div class="nav-title">Касаткина 7</div>
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    Dashboard
                </a>
                <a href="tep.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>
                    Формы ввода
                </a>
                <div class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                    AI Ассистент
                </div>
                <a href="scenarios.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
                    Сценарии
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1 style="font-size: 18px; font-weight: 600;">AI Ассистент</h1>
                    <span class="tag tag-blue">Касаткина 7</span>
                </div>
                <div class="header-right">
                    <button class="voice-toggle" id="voiceToggle" onclick="toggleVoice()">
                        <span class="voice-icon">&#128266;</span>
                        <span id="voiceLabel">Голос вкл</span>
                    </button>
                    <button class="btn btn-ghost">Очистить чат</button>
                </div>
            </header>

            <!-- Chat -->
            <div class="chat-layout">
                <div class="chat-main">
                    <div class="chat-messages" id="chatMessages">
                        <!-- Messages will be loaded by JS -->
                    </div>

                    <!-- Input Area -->
                    <div class="chat-input-area">
                        <div class="chat-input-wrapper">
                            <textarea class="chat-input" id="chatInput" placeholder="Спросите что-нибудь..." rows="1"></textarea>
                            <button class="mic-btn">&#127908;</button>
                            <button class="send-btn" onclick="sendMessage()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                            </button>
                        </div>
                        <div class="quick-prompts">
                            <button class="quick-prompt" onclick="quickPrompt('Сравни с проектом Мира')">Сравни с Мира</button>
                            <button class="quick-prompt" onclick="quickPrompt('Оптимизируй расходы на 10%')">Оптимизируй расходы</button>
                            <button class="quick-prompt" onclick="quickPrompt('Найди ошибки в модели')">Найди ошибки</button>
                            <button class="quick-prompt" onclick="quickPrompt('Экспорт в презентацию')">Экспорт в презентацию</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============ VOICE SETTINGS ============
        let voiceEnabled = localStorage.getItem('voiceEnabled') !== 'false';
        let elevenLabsKey = localStorage.getItem('elevenLabsKey') || '';
        let voiceId = localStorage.getItem('voiceId') || 'pFZP5JQG7iQjIQuC4Bku';
        let currentAudio = null;

        // ============ CONVERSATION DATA ============
        const conversation = [
            {
                type: 'ai',
                text: `<p>Привет, Катя! Я AI-ассистент по финансовому моделированию. Могу помочь с:</p>
                       <p>• Анализом текущей модели<br>
                       • Моделированием сценариев<br>
                       • Сравнением с бенчмарками<br>
                       • Поиском ошибок и аномалий</p>
                       <p>По проекту <strong>Касаткина 7</strong> вижу заполненную модель. Чем могу помочь?</p>`,
                voice: 'Привет, Катя! Я AI ассистент по финансовому моделированию. По проекту Касаткина 7 вижу заполненную модель. Чем могу помочь?'
            },
            {
                type: 'user',
                text: 'Что если поднять цены на 15%?'
            },
            {
                type: 'ai',
                text: `<p>Рассчитала сценарий <strong>"Цены +15%"</strong> с учётом эластичности спроса 0.5:</p>`,
                table: `<table>
                    <thead>
                        <tr><th>Показатель</th><th>База</th><th>+15%</th><th>Δ</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>Цена кв., т.р./м²</td><td>719</td><td>827</td><td class="positive">+108</td></tr>
                        <tr><td>Объём продаж, м²</td><td>91 000</td><td>84 175</td><td class="negative">−7.5%</td></tr>
                        <tr><td>Выручка кв., млрд</td><td>65.4</td><td>69.6</td><td class="positive">+4.2</td></tr>
                        <tr><td>Выручка всего, млрд</td><td>73.5</td><td>77.7</td><td class="positive">+4.2</td></tr>
                        <tr><td>Маржа, млрд</td><td>38.5</td><td>42.7</td><td class="positive">+4.2</td></tr>
                        <tr><td>Маржа, %</td><td>52%</td><td>55%</td><td class="positive">+3 п.п.</td></tr>
                    </tbody>
                </table>`,
                afterTable: `<p>⚠️ <strong>Риск:</strong> При эластичности 0.5 объём продаж снизится на 7.5% (−6 825 м²). Это эквивалентно ~129 непроданным квартирам.</p>
                            <p>✅ <strong>Итог:</strong> Несмотря на снижение объёма, выручка вырастет на <strong>+5.7%</strong>, маржа на <strong>+11%</strong>.</p>`,
                voice: 'Рассчитала сценарий Цены плюс 15 процентов. Риск: при эластичности 0.5 объём продаж снизится на 7.5 процента. Но несмотря на снижение объёма, выручка вырастет на 5.7 процента, маржа на 11 процентов.',
                buttons: [
                    { text: 'Сохранить сценарий', primary: true },
                    { text: 'Применить к модели' },
                    { text: 'Другая эластичность' }
                ]
            },
            {
                type: 'user',
                text: 'А если эластичность 0.3?'
            },
            {
                type: 'ai',
                text: `<p>Пересчитала с <strong>эластичностью 0.3</strong> — более оптимистичный вариант:</p>`,
                table: `<table>
                    <thead>
                        <tr><th>Показатель</th><th>База</th><th>+15% (e=0.3)</th><th>Δ</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>Цена кв., т.р./м²</td><td>719</td><td>827</td><td class="positive">+108</td></tr>
                        <tr><td>Объём продаж, м²</td><td>91 000</td><td>86 905</td><td class="negative">−4.5%</td></tr>
                        <tr><td>Выручка кв., млрд</td><td>65.4</td><td>71.9</td><td class="positive">+6.5</td></tr>
                        <tr><td>Маржа, млрд</td><td>38.5</td><td>44.9</td><td class="positive">+6.4</td></tr>
                        <tr><td>Маржа, %</td><td>52%</td><td>56%</td><td class="positive">+4 п.п.</td></tr>
                    </tbody>
                </table>`,
                afterTable: `<p>🎯 <strong>Вывод:</strong> При эластичности 0.3 результат ещё лучше — маржа растёт на <strong>+16.6%</strong> (+6.4 млрд), а объём падает всего на 4.5%.</p>
                            <p>💡 <strong>Рекомендация:</strong> Провести А/B тест с поднятием цен на 5% в отдельном корпусе, чтобы замерить реальную эластичность.</p>`,
                voice: 'Пересчитала с эластичностью 0.3. При эластичности 0.3 результат ещё лучше — маржа растёт на 16.6 процента, а объём падает всего на 4.5 процента. Рекомендую провести А/Б тест с поднятием цен на 5% в отдельном корпусе.',
                buttons: [
                    { text: 'Сохранить оба сценария', primary: true },
                    { text: 'Сравнить в графике' },
                    { text: 'Настроить А/B тест' }
                ]
            },
            {
                type: 'user',
                text: 'Хорошо, а что у нас с ковенантами по банку?'
            },
            {
                type: 'ai',
                text: `<p>Проверила ковенанты по Касаткина 7:</p>`,
                table: `<table>
                    <thead>
                        <tr><th>Ковенант</th><th>Требование</th><th>Факт</th><th>Статус</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>Цена продажи</td><td>≥ 680 т.р/м²</td><td>719 т.р/м²</td><td class="positive">✓ OK</td></tr>
                        <tr><td>Темп продаж</td><td>≥ 2.5 млрд/кв</td><td>2.8 млрд/кв</td><td class="positive">✓ OK</td></tr>
                        <tr><td>СМР выполнение</td><td>≥ план</td><td>+3%</td><td class="positive">✓ OK</td></tr>
                        <tr><td>Эскроу наполнение</td><td>≥ 70%</td><td>78%</td><td class="positive">✓ OK</td></tr>
                    </tbody>
                </table>`,
                afterTable: `<p>🟢 <strong>Все ковенанты соблюдены.</strong> Запас по наполнению эскроу +8%, по темпам продаж +12%.</p>`,
                voice: 'Проверила ковенанты по Касаткина 7. Все ковенанты соблюдены. Запас по наполнению эскроу плюс 8 процентов, по темпам продаж плюс 12 процентов.',
                buttons: [
                    { text: 'Отчёт в банк' },
                    { text: 'Стресс-тест ковенантов' }
                ]
            }
        ];

        let currentStep = 0;

        // ============ INIT ============
        document.addEventListener('DOMContentLoaded', () => {
            updateVoiceButton();
            loadConversation();
        });

        // ============ VOICE TOGGLE ============
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            localStorage.setItem('voiceEnabled', voiceEnabled);
            updateVoiceButton();

            if (!voiceEnabled && currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                document.querySelectorAll('.message-avatar').forEach(a => a.classList.remove('speaking'));
            }
        }

        function updateVoiceButton() {
            const btn = document.getElementById('voiceToggle');
            const label = document.getElementById('voiceLabel');
            const icon = btn.querySelector('.voice-icon');

            if (voiceEnabled) {
                btn.classList.remove('muted');
                icon.innerHTML = '&#128266;';
                label.textContent = 'Голос вкл';
            } else {
                btn.classList.add('muted');
                icon.innerHTML = '&#128263;';
                label.textContent = 'Голос выкл';
            }
        }

        // ============ LOAD CONVERSATION ============
        function loadConversation() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            conversation.forEach((msg, idx) => {
                setTimeout(() => {
                    addMessage(msg, idx === 0);
                }, idx * 800);
            });
        }

        function addMessage(msg, speakFirst = false) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${msg.type}`;

            if (msg.type === 'ai') {
                let html = `
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        <div class="message-text">${msg.text}</div>
                        ${msg.table ? `<div class="inline-table">${msg.table}</div>` : ''}
                        ${msg.afterTable ? `<div class="message-text">${msg.afterTable}</div>` : ''}
                        ${msg.buttons ? `
                            <div class="message-actions">
                                ${msg.buttons.map(b => `
                                    <button class="action-btn ${b.primary ? 'primary' : ''}">${b.text}</button>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>`;
                div.innerHTML = html;
            } else {
                div.innerHTML = `
                    <div class="message-avatar">КА</div>
                    <div class="message-content">
                        <div class="message-text">${msg.text}</div>
                    </div>`;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            // Speak if it's AI message and voice enabled
            if (msg.type === 'ai' && msg.voice && voiceEnabled && elevenLabsKey && speakFirst) {
                speak(msg.voice, div.querySelector('.message-avatar'));
            }
        }

        // ============ ELEVENLABS TTS ============
        async function speak(text, avatarElement) {
            if (!elevenLabsKey || !voiceEnabled) return;

            try {
                if (avatarElement) avatarElement.classList.add('speaking');

                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'audio/mpeg',
                        'Content-Type': 'application/json',
                        'xi-api-key': elevenLabsKey
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: 'eleven_multilingual_v2',
                        voice_settings: {
                            stability: 0.5,
                            similarity_boost: 0.75
                        }
                    })
                });

                if (!response.ok) {
                    console.error('ElevenLabs error:', response.status);
                    if (avatarElement) avatarElement.classList.remove('speaking');
                    return;
                }

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                currentAudio = new Audio(audioUrl);
                currentAudio.onended = () => {
                    if (avatarElement) avatarElement.classList.remove('speaking');
                    URL.revokeObjectURL(audioUrl);
                    currentAudio = null;
                };
                currentAudio.onerror = () => {
                    if (avatarElement) avatarElement.classList.remove('speaking');
                    currentAudio = null;
                };
                currentAudio.play();

            } catch (error) {
                console.error('TTS error:', error);
                if (avatarElement) avatarElement.classList.remove('speaking');
            }
        }

        // ============ INPUT HANDLING ============
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const container = document.getElementById('chatMessages');

            // Add user message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerHTML = `
                <div class="message-avatar">КА</div>
                <div class="message-content">
                    <div class="message-text">${text}</div>
                </div>`;
            container.appendChild(userDiv);
            container.scrollTop = container.scrollHeight;
            input.value = '';

            // Show typing
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingMsg';
            typingDiv.innerHTML = `
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>`;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;

            // Simulate response
            setTimeout(() => {
                document.getElementById('typingMsg').remove();
                addMessage({
                    type: 'ai',
                    text: `<p>Понял! Сейчас проанализирую "<strong>${text}</strong>" и подготовлю ответ...</p>`,
                    voice: `Понял! Сейчас проанализирую ${text} и подготовлю ответ.`
                }, true);
            }, 2000);
        }

        function quickPrompt(text) {
            document.getElementById('chatInput').value = text;
            sendMessage();
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
